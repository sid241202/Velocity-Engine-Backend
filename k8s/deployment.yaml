apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity-backend-go
  namespace: velocity-namespace
  labels:
    app: velocity-engine
    component: backend-go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velocity-engine
      component: backend-go
  template:
    metadata:
      labels:
        app: velocity-engine
        component: backend-go
    spec:
      containers:
        - name: backend-go
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          image: harbor.example.com/velocity-engine/control-plane-backend-go:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: velocity-backend-go-config
            - secretRef:
                name: velocity-backend-go-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
