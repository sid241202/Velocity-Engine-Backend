apiVersion: v1
kind: ConfigMap
metadata:
  name: velocity-backend-go-config
  namespace: velocity-namespace
data:
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8000"
  LOG_LEVEL: "INFO"
  CORS_ORIGINS: "*"
  KAFKA_BROKERS: "broker:29092"
  RULES_TOPIC: "DE.AUTH.VELOCITY_ENGINE.RULES"
  RESULTS_TOPIC: "DE.AUTH.VELOCITY_ENGINE.RESULTS"
  RESULTS_CONSUMER_GROUP: "velocity-cp-results"
  CLICKHOUSE_HOST: "clickhouse-svc"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_DB: "auth_analytics"
  CLICKHOUSE_TABLE: "velocity_rule_results"
  ICEBERG_S3_PATH: "s3://warehouse/stream_auth.db/auth_txn_raw_union_v1"
  S3_ENDPOINT: "http://minio-svc:9000"
  S3_ACCESS_KEY: "admin"
  LIVE_STORE_MAX_ROWS: "50000"
  LIVE_STORE_HOURS: "24"
  WS_HEARTBEAT_INTERVAL: "30"
---
apiVersion: v1
kind: Secret
metadata:
  name: velocity-backend-go-secrets
  namespace: velocity-namespace
type: Opaque
stringData:
  CLICKHOUSE_PASSWORD: ""
  S3_SECRET_KEY: "password"
