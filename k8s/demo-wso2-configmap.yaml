# Consolidated staging config for the backend's demo-wso2 branch.
#
# NOTE ON FORMAT: this repo's Jenkinsfile references k8s/deployment.yaml
# (its "Update K8s Manifest" stage does a sed-replace on it), but no
# k8s/ directory or existing ConfigMap example exists in this repo to copy
# the format from — checked directly, not assumed (`find ... -iname k8s`
# turned up nothing). The actual Deployment manifest evidently lives
# elsewhere (a separate ops/infra repo, or is generated by a step not in
# this repo). This file is a standard, idiomatic Kubernetes ConfigMap/Secret
# pair — wire it into whatever Deployment actually runs this image via
# envFrom (see the bottom of this file for the exact snippet), adjusting
# names/namespace to match your real manifest.
#
# Secrets are deliberately split into a separate Secret object below, not
# left in the ConfigMap — MYSQL_PASSWORD, CLICKHOUSE_PASSWORD, and the S3
# keys are credentials; everything else here is plain configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: velocity-backend-demo-wso2-config
data:
  # ── Server ──────────────────────────────────────────────────────────────
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8000"
  LOG_LEVEL: "INFO"
  # This app's actual staging frontend origin (raw IP:port, no DNS name) —
  # must match exactly what the browser sends as Origin, scheme included.
  CORS_ORIGINS: "http://10.10.79.27:32515"

  # ── Kafka ───────────────────────────────────────────────────────────────
  KAFKA_BROKERS: "localhost:9092"  # REPLACE — staging Kafka broker list
  RULES_TOPIC: "DE.AUTH.VELOCITY_ENGINE.RULES"
  RESULTS_TOPIC: "DE.AUTH.VELOCITY_ENGINE.RESULTS"
  RESULTS_CONSUMER_GROUP: "velocity-cp-results"
  ANOMALY_TOPIC: "DE.AUTH.VELOCITY_ENGINE.ANOMALIES"
  ANOMALY_CONSUMER_GROUP: "velocity-cp-anomalies"

  # ── ClickHouse ──────────────────────────────────────────────────────────
  CLICKHOUSE_HOST: "localhost"  # REPLACE — staging ClickHouse host
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_DB: "auth_analytics"
  CLICKHOUSE_TABLE: "velocity_rule_results"
  # CLICKHOUSE_PASSWORD — see Secret below, not here.

  # ── Iceberg / S3 ────────────────────────────────────────────────────────
  ICEBERG_URI: "thrift://localhost:9083"  # REPLACE — staging Hive Metastore/Iceberg catalog URI
  S3_ENDPOINT: "http://localhost:9000"    # REPLACE — staging S3/MinIO endpoint
  ICEBERG_TABLE: "stream_auth.auth_txn_raw_union_v1"
  ICEBERG_S3_PATH: "s3://warehouse/stream_auth.db/auth_txn_raw_union_v1"
  # S3_ACCESS_KEY / S3_SECRET_KEY — see Secret below, not here. Required
  # (boot panic) once ENV=prod.

  # ── LiveStore ───────────────────────────────────────────────────────────
  LIVE_STORE_MAX_ROWS: "50000"
  LIVE_STORE_HOURS: "24"
  WS_HEARTBEAT_INTERVAL: "30"

  # ── MySQL (RBAC + rule store) ───────────────────────────────────────────
  MYSQL_HOST: "localhost"  # REPLACE — staging MySQL host
  MYSQL_PORT: "3306"
  MYSQL_USER: "root"       # REPLACE — staging MySQL user
  MYSQL_DATABASE: "velocity_engine_iam"
  MYSQL_MAX_OPEN_CONNS: "20"
  MYSQL_MAX_IDLE_CONNS: "10"
  # MYSQL_PASSWORD — see Secret below, not here.
  # Schema itself (users/roles/permissions/user_roles/role_permissions/
  # audit_log + the rule-store tables) is NOT created by this backend —
  # provision it manually first via internal/migrations/mysql/*.sql. The
  # backend only verifies it exists at boot (VerifyMySQLSchema) and fails
  # RBAC-protected routes closed (503) if it's missing — it does not refuse
  # to start.

  # ── RBAC cache tuning ───────────────────────────────────────────────────
  RBAC_PERMISSION_CACHE_TTL_SECONDS: "300"
  RBAC_PERMISSION_MAX_STALE_SECONDS: "1800"

  # ── WSO2 / OIDC — this branch's only identity path (no dev-mode fallback
  # exists on demo-wso2; AUTH_DEV_MODE/AUTH_MODE do not exist as config keys
  # on this branch at all — do not add them back here) ────────────────────
  WSO2_JWKS_URI: "https://sso.uidai.net.in/oauth2/jwks"
  WSO2_ISSUER: "https://sso.uidai.net.in/oauth2"
  # WSO2_AUDIENCE: the client_id WSO2 issues in the access token's "aud"
  # claim for this app's Service Provider — REQUIRED, backend panics at
  # boot without it. Do not assume it equals REACT_APP_CLIENT_ID below
  # without confirming against a real decoded token first — see
  # WSO2_RBAC_STAGING_INTEGRATION_GUIDE.md §2.4/§6.1.
  WSO2_AUDIENCE: "9HGuTetQjRjxkx1vHmoP1v0fXm8a"  # REPLACE if a distinct staging client_id is registered — see the frontend's k8s/demo-wso2-configmap.yaml and "What WSO2 must issue separately" in WSO2_RBAC_STAGING_INTEGRATION_GUIDE.md
  JWT_CLOCK_SKEW_SECONDS: "60"

  # ── Env marker ──────────────────────────────────────────────────────────
  # Deliberately NOT "prod" here even though this is staging — ENV=prod
  # trips the existing S3-key boot panic AND is reserved for the real
  # production environment. Leave unset/"staging" unless you specifically
  # want prod's stricter boot checks enforced in staging too.
  ENV: "staging"
---
apiVersion: v1
kind: Secret
metadata:
  name: velocity-backend-demo-wso2-secrets
type: Opaque
stringData:
  MYSQL_PASSWORD: "REPLACE_ME"
  CLICKHOUSE_PASSWORD: "REPLACE_ME"
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"

# ── Wiring into your actual Deployment ──────────────────────────────────
# Add to the backend container spec in whatever Deployment manifest really
# runs this image:
#
#   envFrom:
#     - configMapRef:
#         name: velocity-backend-demo-wso2-config
#     - secretRef:
#         name: velocity-backend-demo-wso2-secrets
